{% extends "base.html" %}
{% block content %}
<div class="row g-3">
<div class="col-md-4">
<div class="card nav-card p-3">
<div class="d-flex align-items-center mb-3">
<div class="brand-logo" style="width:56px;height:56px;border:2px solid var(--green)">ADMIN</div>
<div class="ms-3"><h6 class="mb-0 fw-bold">Board Admin</h6><small class="text-muted">Administrator</small></div>
</div>
<hr>
<h6 class="fw-bold" style="color:var(--green)">🎨 School Logo - Admin Only</h6>
<form method="POST" enctype="multipart/form-data" class="mt-2">
<input type="file" name="logo" class="form-control form-control-sm mb-2" accept="image/*">
<button class="btn btn-sm w-100" style="background:var(--green);color:white">Upload Logo</button>
</form>
<hr>
<button class="btn w-100 text-start fw-bold mb-2" style="background:var(--green);color:white;border-radius:20px" data-bs-toggle="collapse" data-bs-target="#passBox">🔑 Change Password</button>
<div id="passBox" class="collapse">
<form method="POST" action="/change_password">
<input name="new_password" type="password" placeholder="New Password" class="form-control form-control-sm mb-2" required>
<button class="btn btn-sm btn-dark w-100">Update</button>
</form>
</div>
<hr>
<h6 class="fw-bold" style="color:var(--green)">➕ Add New Teacher</h6>
<form method="POST" action="/add_teacher" class="mt-2">
<input name="username" placeholder="Teacher Username" class="form-control form-control-sm mb-2" required>
<input name="email" type="email" placeholder="Teacher Email" class="form-control form-control-sm mb-2" required>
<input name="password" type="password" placeholder="Temporary Password" class="form-control form-control-sm mb-2" required>
<button class="btn btn-sm w-100" style="background:var(--gold);color:var(--green);font-weight:700">Add Teacher</button>
</form>
<hr>
<h6 class="fw-bold" style="color:var(--green)">➕ Add User (Parent/Pupil)</h6>
<form method="POST" action="/add_user" class="mt-2">
<input name="username" placeholder="Username" class="form-control form-control-sm mb-2" required>
<select name="role" class="form-control form-control-sm mb-2"><option value="parent">Parent</option><option value="pupil">Pupil</option><option value="teacher">Teacher</option></select>
<input name="email" type="email" placeholder="Email" class="form-control form-control-sm mb-2">
<input name="password" type="password" placeholder="Password" class="form-control form-control-sm mb-2" required>
<button class="btn btn-sm btn-outline-dark w-100">Add User</button>
</form>
</div>
</div>

<div class="col-md-8">
<div class="card nav-card p-3">
<h5 class="fw-bold" style="color:var(--green)">All Users - Reset & Email</h5>
<div class="table-responsive">
<table class="table table-sm table-hover mt-2" style="font-size:13px">
<thead style="background:var(--green);color:white"><tr><th>Username</th><th>Role</th><th>Email</th><th>Reset</th></tr></thead>
<tbody>
{% for user in users %}
<tr><td class="fw-bold">{{user.username}}</td><td><span class="badge bg-light text-dark border">{{user.role}}</span></td><td><small>{{user.email}}</small></td><td>
<form method="POST" action="/reset_password" class="d-flex gap-1">
<input type="hidden" name="username" value="{{user.username}}">
<input name="new_password" placeholder="new" class="form-control form-control-sm" style="width:70px" required>
<button class="btn btn-sm btn-dark">Set</button>
</form>
</td></tr>
{% endfor %}
</tbody>
</table>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
