{% extends "base.html" %}
{% block content %}
<div style="padding:15px;max-width:600px;margin:auto;">
<h3>Publish - Last Teacher</h3>
<form method="GET" style="display:flex;gap:8px;margin-bottom:15px;">
<select name="grade" onchange="this.form.submit()"><option>Grade 10A</option><option>Grade 11A</option><option>Grade 12A</option></select>
<select name="term" onchange="this.form.submit()"><option>Term1</option><option selected>Term2</option><option>Term3</option></select>
</form>
<div style="background:white;padding:12px;border-radius:8px;margin-bottom:15px;">
{% for s in progress %}
<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;"><span>{% if s.count>0 %}✅{% else %}❌{% endif %} {{s.name}}</span><span>{{s.count}}/{{total_pupils}}</span></div>
{% endfor %}
</div>
<form method="POST" action="/teacher/publish-all">
<input type="hidden" name="grade" value="{{grade}}">
<input type="hidden" name="term" value="{{term}}">
<label style="display:flex;gap:10px;padding:12px;background:#fffbeb;border:2px solid #f59e0b;border-radius:8px;margin-bottom:12px;"><input type="checkbox" name="is_last" value="1" required><span><b>I am LAST teacher</b> - Publish all subjects together</span></label>
<button type="submit" style="width:100%;padding:14px;background:#dc2626;color:white;border:none;border-radius:8px;">PUBLISH ALL RESULTS</button>
</form>
</div>
{% endblock %}
