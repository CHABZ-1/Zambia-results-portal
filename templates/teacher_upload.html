{% extends "base.html" %}
{% block content %}
<div style="padding:15px;">
<h3>Enter Marks - Column View</h3>
<form method="GET" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px;">
<select name="grade" onchange="this.form.submit()">
{% for g in ["Grade 8A","Grade 8B","Grade 9A","Grade 9B","Grade 10A","Grade 10B","Grade 11A","Grade 12A"] %}
<option value="{{g}}" {% if g==grade %}selected{% endif %}>{{g}}</option>
{% endfor %}
</select>
<select name="term" onchange="this.form.submit()">
<option value="Term1" {% if term=="Term1" %}selected{% endif %}>Term 1</option>
<option value="Term2" {% if term=="Term2" %}selected{% endif %}>Term 2</option>
<option value="Term3" {% if term=="Term3" %}selected{% endif %}>Term 3</option>
</select>
<select name="subject_id" onchange="this.form.submit()">
{% for s in subjects %}
<option value="{{s.id}}" {% if s.id==subject_id %}selected{% endif %}>{{s.name}}</option>
{% endfor %}
</select>
</form>
<form method="POST">
<input type="hidden" name="grade" value="{{grade}}">
<input type="hidden" name="term" value="{{term}}">
<input type="hidden" name="subject_id" value="{{subject_id}}">
<table style="width:100%;border-collapse:collapse;background:white;">
<tr style="background:#1e40af;color:white;">
<th style="padding:8px;text-align:left;">Pupil</th>
<th style="width:80px;">Score</th>
<th style="width:35%;">Comment</th>
</tr>
{% for p in pupils %}
<tr style="border-bottom:1px solid #ddd;">
<td style="padding:8px;">{{p.full_name}}</td>
<td><input type="number" name="score_{{p.id}}" min="0" max="100" placeholder="0-100" style="width:70px;padding:6px;border:1px solid #ccc;border-radius:4px;"></td>
<td><input type="text" name="comment_{{p.id}}" placeholder="e.g. Very Good" style="width:95%;padding:6px;border:1px solid #ccc;border-radius:4px;"></td>
</tr>
{% else %}
<tr><td colspan="3" style="padding:20px;text-align:center;">No pupils in {{grade}}. Add pupils first in Teacher > Pupils.</td></tr>
{% endfor %}
</table>
<br>
<button type="submit" style="width:100%;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px;font-weight:bold;">SAVE DRAFT ({{pupils|length}} pupils)</button>
</form>
<br>
<a href="/teacher/publish?grade={{grade}}&term={{term}}" style="display:block;text-align:center;padding:12px;background:#2563eb;color:white;border-radius:8px;text-decoration:none;">Go to PUBLISH →</a>
</div>
{% endblock %}
