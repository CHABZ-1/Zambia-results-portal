<!DOCTYPE html>
<html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mkushi Boarding</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial}
body{min-height:100vh;background:#092e1c;display:flex;flex-direction:column}
.top{background:#0d2f1d;display:flex;align-items:center;padding:14px 20px;border-bottom:4px solid #d4a017;position:relative;overflow:hidden}
.top:after{content:'';position:absolute;right:-15px;top:0;width:90px;height:100%;background:#d4a017;transform:skewX(-20deg)}
.logo-circle{width:70px;height:70px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0d2f1d;margin-right:14px;flex-shrink:0;font-size:12px;text-align:center;line-height:1.1;border:2px solid #d4a017}
.top h1{color:white;font-size:14px;letter-spacing:0.5px;line-height:1.2}
.top p{color:#d4a017;font-size:11px;font-style:italic;margin-top:4px}
.wrap{flex:1;background:url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=800') center/cover;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:rgba(255,255,255,0.97);width:100%;max-width:360px;border-radius:20px;padding:24px 20px 16px;box-shadow:0 15px 35px rgba(0,0,0,0.4)}
.card-logo{width:80px;height:80px;background:white;border:2px solid #0d2f1d;border-radius:10px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#0d2f1d;text-align:center}
.line{height:2px;background:#e0e0e0;margin:10px 30px}
.line-gold{height:2px;background:#d4a017;margin:8px 20px}
.card h2{font-size:11px;text-align:center;letter-spacing:1px;color:#111;line-height:1.3}
.card h3{font-size:20px;text-align:center;margin:14px 0 2px;font-weight:800;color:#111}
.card .sub{font-size:12px;text-align:center;color:#777;margin-bottom:14px}
.field{display:flex;align-items:center;background:white;border:1px solid #ddd;border-radius:25px;padding:11px 14px;margin-bottom:10px}
.field input,.field select{border:0;outline:0;width:100%;background:transparent;font-size:14px;margin-left:8px}
.btn{width:100%;background:#0d2f1d;color:white;border:0;border-radius:25px;padding:12px;font-size:15px;font-weight:700;margin-top:6px}
.links{display:flex;justify-content:space-between;font-size:11px;color:#333;margin-top:14px}
.foot{text-align:center;color:#aaa;font-size:10px;padding:14px;letter-spacing:2px;background:#0a2416}
</style>
</head>
