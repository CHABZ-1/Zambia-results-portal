{% extends "base.html" %}
{% block content %}
<div style="max-width:400px;margin:20px auto;padding:15px;">
<h2>Zafika Portal Sign In</h2>
<div style="display:flex;gap:10px;margin:15px 0;">
<button type="button" onclick="setRole('parent')" id="btn-parent" style="padding:8px 12px;border:1px solid #ccc;border-radius:6px;">Parent</button>
<button type="button" onclick="setRole('pupil')" id="btn-pupil" style="padding:8px 12px;border:1px solid #ccc;border-radius:6px;">Pupil</button>
<button type="button" onclick="setRole('teacher')" id="btn-teacher" style="padding:8px 12px;background:#16a34a;color:white;border-radius:6px;">Teacher</button>
<button type="button" onclick="setRole('admin')" id="btn-admin" style="padding:8px 12px;border:1px solid #ccc;border-radius:6px;">Admin</button>
</div>
<form method="POST" action="/login">
<input type="hidden" name="role" id="roleInput" value="teacher">
<label>Username</label>
<input type="text" name="username" required placeholder="Enter username" style="width:100%;padding:10px;margin:5px 0 10px 0;border:1px solid #ccc;border-radius:6px;">
<label>Password</label>
<input type="password" name="password" required placeholder="Enter password" style="width:100%;padding:10px;margin:5px 0 15px 0;border:1px solid #ccc;border-radius:6px;">
<button type="submit" style="width:100%;padding:12px;background:black;color:white;border:none;border-radius:8px;">Sign In</button>
</form>
<p style="margin-top:15px;font-size:13px;color:#666;">Test: admin / admin123 , teacher / teacher123</p>
</div>
<script>
function setRole(r){
  document.getElementById('roleInput').value=r;
  document.querySelectorAll('[id^=btn-]').forEach(b=>{b.style.background='white';b.style.color='black';});
  document.getElementById('btn-'+r).style.background='#16a34a';
  document.getElementById('btn-'+r).style.color='white';
}
</script>
{% endblock %}
