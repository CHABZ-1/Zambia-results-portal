<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mkushi Boarding - Login</title>
<style>body{font-family:Arial;background:#0a3d2e;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.box{background:#fff;padding:30px;border-radius:12px;width:90%;max-width:350px;text-align:center}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{width:100%;padding:12px;background:#0a3d2e;color:#fff;border:none;border-radius:8px;font-weight:bold}.err{color:red}</style></head>
<body><div class="box"><h2>🏫 Mkushi Boarding</h2><p>Results Portal</p>
{% if error %}<p class="err">{{error}}</p>{% endif %}
<form method="POST"><input name="username" placeholder="Exam No / Username" required><input name="password" type="password" placeholder="Password (Parent: Last 4 digits of phone)" required><button>LOGIN</button></form>
<p style="font-size:12px">Pupil: Exam No as username<br>Admin: admin / admin123<br><a href="/verify/TEST">Verify Result</a></p></div></body></html>
