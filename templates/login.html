<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Mkushi Boarding</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial} html{color-scheme:light}
body{min-height:100vh;background:#0e2e1b;display:flex;flex-direction:column}
.top{background:#0d2f1d;padding:14px 20px;border-bottom:4px solid #d4a017;position:relative;overflow:hidden}
.top:after{content:'';position:absolute;right:-10px;top:0;width:70px;height:100%;background:#d4a017;transform:skewX(-20deg)}
.top h1{color:white!important;font-size:13px;line-height:1.2;z-index:2;position:relative} .top p{color:#d4a017!important;font-size:10px;font-style:italic;margin-top:3px;z-index:2;position:relative}
.wrap{flex:1;background:linear-gradient(rgba(0,0,0,0.15),rgba(0,0,0,0.15)),url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=800') center/cover;display:flex;justify-content:center;align-items:center;padding:18px}
.card{background:white!important;width:100%;max-width:380px;border-radius:20px;padding:20px;box-shadow:0 15px 35px rgba(0,0,0,0.5)}
.card h2{font-size:11px;text-align:center;color:#111!important;letter-spacing:1px;font-weight:700} .line{height:1px;background:#d4a017;margin:10px 20px}
.card h3{font-size:19px;text-align:center;color:#111!important;font-weight:800;margin:10px 0 2px} .sub{font-size:11px;text-align:center;color:#666!important;margin-bottom:12px}
.role-tabs{display:flex;gap:6px;margin-bottom:12px} .tab{flex:1;padding:8px;font-size:11px;border-radius:20px;border:1px solid #ddd;background:#f5f5f5;text-align:center;cursor:pointer;color:#111!important} .tab.active{background:#0d2f1d;color:white!important;border-color:#0d2f1d}
.field{display:flex;align-items:center;background:#f8f8f8!important;border:1px solid #ddd;border-radius:25px;padding:10px 14px;margin-bottom:8px} .field input,.field select{border:0;outline:0;width:100%;background:transparent!important;font-size:13px;margin-left:6px;color:#111!important}
.btn{width:100%;background:#0d2f1d!important;color:white!important;border:0;border-radius:25px;padding:11px;font-size:14px;font-weight:700;margin-top:6px}
.hidden{display:none} .foot{text-align:center;color:#aaa!important;font-size:9px;padding:10px;background:#0a2416;letter-spacing:2px}
</style>
</head>
<body>
<div class="top"><div><h1>MKUSHI BOARDING SECONDARY SCHOOL BOARD</h1><p>Discipline & Hardwork Lead to Prosperity</p></div></div>
<div class="wrap">
<div class="card">
<h2>MKUSHI BOARDING SECONDARY SCHOOL BOARD</h2><div class="line"></div>
<h3>Login to Your Account</h3><p class="sub">Access your academic portal</p>

<div class="role-tabs">
<div class="tab active" onclick="setRole('admin',this)">Admin</div>
<div class="tab" onclick="setRole('teacher',this)">Teacher</div>
<div class="tab" onclick="setRole('parent',this)">Parent</div>
<div class="tab" onclick="setRole('pupil',this)">Pupil</div>
</div>

<form method="POST" id="loginForm">
<input type="hidden" name="role" id="role" value="admin">

<div id="admin-teacher-fields">
<div class="field">👤<input name="username" placeholder="Username"></div>
<div class="field">🔒<input type="password" name="password" placeholder="Password"></div>
</div>

<div id="parent-fields" class="hidden">
<div class="field">👦<input name="child_name" placeholder="Child Full Name"></div>
<div class="field">🎓<input name="grade" placeholder="Grade e.g Grade 10A"></div>
<div class="field">📱<input name="parent_phone" placeholder="Parent Phone"></div>
</div>

<div id="pupil-fields" class="hidden">
<div class="field">👦<input name="child_name" placeholder="Your Full Name"></div>
<div class="field">🎓<input name="grade_level" placeholder="Grade e.g Grade 10"></div>
<div class="field">🏫<input name="class_section" placeholder="Class e.g A"></div>
</div>

<button class="btn">→ Login</button>
</form>
</div>
</div>
<div class="foot">Discipline • Hardwork • Prosperity</div>
<script>
function setRole(r, el){
document.getElementById('role').value=r;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.getElementById('admin-teacher-fields').classList.toggle('hidden', r=='parent' || r=='pupil');
document.getElementById('parent-fields').classList.toggle('hidden', r!='parent');
document.getElementById('pupil-fields').classList.toggle('hidden', r!='pupil');
}
</script>
</body>
</html>
