<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Mkushi Boarding Secondary - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif}
html{color-scheme:light}
body{min-height:100vh;display:flex;flex-direction:column;background:#0d2f1d}
.top{background:#0d2f1d;padding:12px 20px;border-bottom:3px solid #c9a227;display:flex;align-items:center;position:relative;overflow:hidden}
.top:after{content:'';position:absolute;right:-12px;top:0;width:72px;height:100%;background:#c9a227;transform:skewX(-18deg)}
.top h1{color:#ffffff!important;font-size:12px;letter-spacing:0.8px;line-height:1.25;font-weight:700;position:relative;z-index:2}
.top p{color:#c9a227!important;font-size:10px;font-style:italic;margin-top:3px;letter-spacing:0.3px;position:relative;z-index:2}
.wrap{flex:1;background:linear-gradient(rgba(0,0,0,0.18),rgba(0,0,0,0.18)), url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=800') center/cover;display:flex;justify-content:center;align-items:center;padding:20px 16px}
.card{background:#ffffff!important;width:100%;max-width:360px;border-radius:16px;padding:22px 18px 16px;box-shadow:0 12px 32px rgba(0,0,0,0.35)}
.card h2{font-size:10.5px;text-align:center;color:#1a1a1a!important;letter-spacing:1px;line-height:1.3;font-weight:700;text-transform:uppercase}
.line{height:1px;background:#c9a227;margin:12px 24px}
.card h3{font-size:18px;text-align:center;color:#111111!important;font-weight:800;margin:10px 0 4px}
.sub{font-size:11.5px;text-align:center;color:#6b6b6b!important;margin-bottom:16px}
.role-tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:7px 2px;font-size:11px;font-weight:600;border-radius:999px;border:1px solid #d9d9d9;background:#f2f2f2;text-align:center;cursor:pointer;color:#222!important;transition:0.15s}
.tab.active{background:#0d2f1d;color:#ffffff!important;border-color:#0d2f1d}
.field{border:1px solid #d6d6d6;background:#f9f9f9!important;border-radius:999px;padding:11px 16px;margin-bottom:9px}
.field input,.field select{border:0;outline:0;width:100%;background:transparent!important;font-size:13px;color:#222!important}
.field input::placeholder{color:#8a8a8a}
.btn{width:100%;background:#0d2f1d!important;color:#ffffff!important;border:0;border-radius:999px;padding:11px;font-size:13.5px;font-weight:700;letter-spacing:0.3px;margin-top:8px;cursor:pointer}
.foot{text-align:center;color:#9aa3a0!important;font-size:9px;padding:10px;background:#0a2416;letter-spacing:2px;text-transform:uppercase}
.hidden{display:none}
</style>
</head>
<body>
<div class="top">
<div>
<h1>MKUSHI BOARDING SECONDARY SCHOOL BOARD</h1>
<p>Discipline & Hardwork Lead to Prosperity</p>
</div>
</div>

<div class="wrap">
<div class="card">
<h2>MKUSHI BOARDING SECONDARY SCHOOL BOARD</h2>
<div class="line"></div>
<h3>Login to Your Account</h3>
<p class="sub">Access your academic portal</p>

<div class="role-tabs">
<div class="tab active" onclick="setRole('admin',this)">Admin</div>
<div class="tab" onclick="setRole('teacher',this)">Teacher</div>
<div class="tab" onclick="setRole('parent',this)">Parent</div>
<div class="tab" onclick="setRole('pupil',this)">Pupil</div>
</div>

<form method="POST">
<input type="hidden" name="role" id="role" value="admin">

<div id="admin-teacher-fields">
<div class="field"><input name="username" placeholder="Username" required></div>
<div class="field"><input type="password" name="password" placeholder="Password" required></div>
</div>

<div id="parent-fields" class="hidden">
<div class="field"><input name="child_name" placeholder="Child Full Name"></div>
<div class="field"><input name="grade" placeholder="Grade e.g Grade 10A"></div>
<div class="field"><input name="parent_phone" placeholder="Parent Phone Number"></div>
</div>

<div id="pupil-fields" class="hidden">
<div class="field"><input name="child_name" placeholder="Full Name"></div>
<div class="field"><input name="grade_level" placeholder="Grade e.g Grade 10"></div>
<div class="field"><input name="class_section" placeholder="Class e.g A"></div>
</div>

<button class="btn">Login</button>
</form>

</div>
</div>

<div class="foot">Discipline • Hardwork • Prosperity</div>

<script>
function setRole(r, el){
document.getElementById('role').value=r;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.getElementById('admin-teacher-fields').classList.toggle('hidden', r=='parent' || r=='pupil');
document.getElementById('parent-fields').classList.toggle('hidden', r!='parent');
document.getElementById('pupil-fields').classList.toggle('hidden', r!='pupil');
}
</script>
</body>
</html>
