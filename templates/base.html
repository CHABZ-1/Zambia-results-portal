<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mkushi Boarding</title>
<style>
body { margin:0; font-family:Arial; background:#f3f4f6; position:relative; min-height:100vh; }
body::after {
  content:"";
  position:fixed; top:0; left:0; right:0; bottom:0;
  background-image: url('/static/IMG_2053.jpeg');
  background-repeat:no-repeat; background-position:center; background-size:380px;
  opacity:0.08; pointer-events:none; z-index:-1;
}
.topbar { background:white; padding:10px 15px; display:flex; align-items:center; gap:12px; border-bottom:3px solid #16a34a; position:sticky; top:0; z-index:10; }
.topbar img { width:50px; height:50px; border-radius:50%; border:2px solid #16a34a; object-fit:cover; }
.topbar h2 { margin:0; font-size:16px; line-height:1.2; }
.topbar small { color:#16a34a; font-weight:bold; }
.container { padding:10px; }
.flash.success { background:#dcfce7; padding:10px; margin:10px; border-radius:6px; }
.flash.error { background:#fee2e2; padding:10px; margin:10px; border-radius:6px; }
</style>
</head>
<body>
<div class="topbar">
  <img src="/static/IMG_2053.jpeg" alt="logo" onerror="this.src='/IMG_2053.jpeg'">
  <div>
    <h2>MKUSHI BOARDING<br>SECONDARY SCHOOL</h2>
    <small>DISCIPLINE & HARDWORK</small>
  </div>
  <div style="margin-left:auto;">
    {% if session.username %}<a href="/logout" style="text-decoration:none;background:#111;color:white;padding:6px 12px;border-radius:6px;font-size:13px;">Logout</a>{% endif %}
  </div>
</div>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endif %}
{% endwith %}
<div class="container">{% block content %}{% endblock %}</div>
</body>
</html>
